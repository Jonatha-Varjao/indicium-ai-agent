[project]
name = "indicium-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chardet>=7.4.3",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.1",
    "langfuse>=4.14.1",
    "langgraph>=1.2.9",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "tavily-python>=0.7.26",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ipython>=9.15.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.3.260530",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C90", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S105", "E501"]
"src/indicium_ai_agent/config/metrics_spec.py" = ["RUF001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"
warn_return_any = true
disallow_untyped_defs = true
show_error_codes = true
exclude = ["\\.venv", "__pycache__"]

[[tool.mypy.overrides]]
module = [
    "chardet.*",
    "duckdb.*",
    "langchain.*",
    "langchain_google_genai.*",
    "langfuse.*",
    "matplotlib.*",
    "seaborn.*",
    "tavily.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=75"
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.black]
line-length = 100
target-version = ["py314"]
